name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing here touches the repository through the API — the deploy talks to the
# relay host over SSH — so the workflow default is no permissions at all
# (checkov CKV2_GHA_1). The jobs below set their own; this line is what a job
# added later inherits instead of the repository-wide default, which on a
# repository created before 2023 is still write-all.
permissions: {}

# The relay host builds its own image.
#
# The previous pipeline pushed to GHCR and had the host pull it, but the push
# is rejected — `denied: permission_denied: write_package`: the package is not
# writable by this repository's GITHUB_TOKEN, so every deploy since that broke
# silently left production on an old image. The host was already running a
# locally built image (docker-compose.yml defaults to relay-local:amd64), so
# building there removes the registry from the path entirely and needs nothing
# beyond the SSH secrets that already exist.
jobs:
  # The gate. This workflow used to go straight from `push: main` to building
  # the image and recreating the production container, so the ~180 tests in the
  # repo never ran against the commit being shipped — a red main deployed
  # exactly like a green one. ci.yml is CALLED rather than copied so the check
  # a reviewer approved on the PR and the check the deploy waits on cannot
  # drift apart.
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions: {}
    # GitHub's default is 360 minutes, and this job holds a concurrency group
    # that every later push queues behind: one ssh that hangs with the far end
    # still answering TCP (a wedged build, a full disk, a host mid-reboot) used
    # to keep deploys from running for six hours, with nothing to look at but a
    # step that never ends. A cold build is ~6 minutes, the recreate and its
    # health wait under 2, so 30 is generous and still a bound.
    timeout-minutes: 30
    concurrency:
      group: deploy-relay
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Shipping and building used to be two appleboy actions. They were pinned
      # by commit SHA, but a SHA pins only what GitHub checks out: scp-action is
      # a docker action built `FROM ghcr.io/appleboy/drone-scp:1.6.14`, a tag
      # its owner can move, and ssh-action downloads a drone-ssh release tarball
      # at runtime without checking any hash. Both were handed
      # SSH_PRIVATE_KEY, and that key's user is in the docker group on the relay
      # host — root, in effect. The runner already has OpenSSH, so the steps
      # below use it and the third party is simply gone from the path.
      #
      # SSH_KNOWN_HOSTS is what makes StrictHostKeyChecking mean anything: the
      # actions accepted whatever host key answered, so a MITM on the first
      # connect collected the deploy key. Produce it once with
      #   ssh-keyscan -t ed25519 <relay host>
      # and paste that line into the secret (DEPLOY.md lists it with the rest).
      - name: Configure SSH to the relay host
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::SSH_KNOWN_HOSTS is not set. Run 'ssh-keyscan -t ed25519 <relay host>' on a machine you trust and paste the line into the secret (see DEPLOY.md, GitHub Secrets)." >&2
            exit 1
          fi
          # umask first, so the key is never briefly world-readable between the
          # write and the chmod.
          umask 077
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/relay_key
          # Re-keyed to the alias below, because ssh looks a host key up by the
          # name it is connecting to: a secret scanned as `opencode.example`
          # does not answer for a SSH_HOST that spells the same machine as an
          # address, and the deploy stops with "No ED25519 host key is known
          # for ... and you have requested strict checking" while nothing is
          # wrong with the key. What is pinned is the key material the operator
          # vouched for; how they spelled the host is not part of that promise.
          awk '$2 ~ /^(ssh-|ecdsa-|sk-)/ { $1 = "relay-host"; print }' <<<"$SSH_KNOWN_HOSTS" > ~/.ssh/relay_known_hosts
          if [ ! -s ~/.ssh/relay_known_hosts ]; then
            echo "::error::SSH_KNOWN_HOSTS holds no usable host key line. Expected ssh-keyscan output, e.g. 'host ssh-ed25519 AAAA...'." >&2
            exit 1
          fi
          chmod 600 ~/.ssh/relay_key ~/.ssh/relay_known_hosts
          # One Host alias, so no later step can drift into a weaker option set
          # (and the host and user stay out of the command lines in the log).
          # ConnectTimeout/ServerAlive* are set here rather than left to the
          # runner's defaults: on ubuntu-latest `BatchMode yes` happens to bring
          # a Debian-specific ServerAliveInterval of 300 (so ~15 minutes to
          # notice a dead peer), and on any other image it would be 0 — no
          # keepalive at all, and a dropped connection hangs until TCP gives up.
          # 30 x 6 is three minutes to notice a peer that has stopped answering.
          # It does not cover a peer that answers while the remote command
          # hangs; the job's timeout-minutes is what bounds that.
          cat >> ~/.ssh/config <<CONF
          Host relay-host
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/relay_key
            IdentitiesOnly yes
            UserKnownHostsFile ~/.ssh/relay_known_hosts
            HostKeyAlias relay-host
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 30
            ServerAliveCountMax 6
          CONF
          chmod 600 ~/.ssh/config

      - name: Ship the build context
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Cleared first: a re-run of the same commit must not merge into a
          # half-shipped context (what the old action's `overwrite: true` did).
          ssh relay-host "rm -rf ~/rc-build/$SHA && mkdir -p ~/rc-build/$SHA"
          scp -r relay "relay-host:rc-build/$SHA/"

      - name: Build the image and restart the relay
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The script below runs on the relay host, fed to bash over stdin.
          # SHA is passed as a shell assignment in front of it rather than
          # pasted into the script body, which stays a quoted here-doc: nothing
          # from the workflow context is ever re-parsed by the remote shell.
          ssh relay-host "SHA='$SHA' bash -s" <<'REMOTE'
          set -e
          cd "$HOME/rc-build/$SHA/relay"

          # Keep the running image reachable for a rollback before the tag moves.
          # The stamp carries seconds, not just minutes: two deploys inside the
          # same minute collided on one tag, and the second overwrote the only
          # pointer to the last good image with the first deploy's build.
          ROLLBACK_TAG="relay-local:rollback-$(date +%Y%m%d-%H%M%S)"
          if docker tag relay-local:amd64 "$ROLLBACK_TAG"; then
            echo "rollback target: $ROLLBACK_TAG"
          else
            # First deploy on a fresh host: there is no previous image at all.
            echo "no relay-local:amd64 yet — this deploy has no rollback target" >&2
            ROLLBACK_TAG=""
          fi

          # Poll /health until the relay answers. A function, so the rollback
          # can reuse it and so every failing probe stays inside an `if` —
          # a bare failing command under `set -e` would end the script before
          # the rollback ran, which is half of why the old rollback never did.
          # Kept POSIX-plain (no `local`) although this now runs under bash:
          # the same lines are what an operator pastes into a shell on the host.
          # The port comes from the host's .env, not from this file: PORT is
          # documented as a knob (relay/.env.example), and hard-coding 8080
          # here made a relay moved off it fail its own deploy — twenty
          # refused connections, a rollback, and a healthy container reported
          # dead. Read by absolute path, so it does not depend on the cwd.
          # DIGITS only: .env is compose's format, not a shell's, so PORT="9090"
          # and a CRLF line are both legal there and start the container fine —
          # taken verbatim they put a quote or a CR into the URL below and every
          # probe fails with `curl: (3) URL rejected`, which is the same healthy
          # container declared dead. The leading class drops an opening quote,
          # the trailing one a closing quote, a CR, spaces or a comment; a line
          # with no digits at all leaves HEALTH_PORT empty for the fallback.
          wait_healthy() {
            HEALTH_PORT=$(sed -n 's/^PORT=[^0-9]*\([0-9][0-9]*\).*/\1/p' /opt/opencode-remote-control/.env | tail -1)
            HEALTH_PORT=${HEALTH_PORT:-8080}
            i=1
            while [ "$i" -le 20 ]; do
              if curl -fsS -m 3 "http://127.0.0.1:$HEALTH_PORT/health"; then
                echo
                return 0
              fi
              sleep 3
              i=$((i + 1))
            done
            return 1
          }

          # A clean checkout has relay/public/index.html and join.html but not
          # the built UI assets they load (gitignored), so the image builds the
          # opencode web UI from the pinned upstream ref. UI_SOURCE=source is
          # required, not an optimisation: this host has no buildx, so its
          # classic builder runs every stage and the `prebuilt` default would
          # ship an image whose public/ is those two pages and nothing else.
          # The digest in the Dockerfile is what fixes the base; --pull is what
          # fails the build loudly if the registry no longer serves that digest
          # (and fetches it on a host that does not have it yet) — this host's
          # daemon had been answering `node:22-slim` from its cache for eleven
          # days.
          docker build --pull --build-arg UI_SOURCE=source -t relay-local:amd64 .

          cd /opt/opencode-remote-control
          # The compose file is versioned with the relay code: ship it on every
          # deploy so the host copy can never drift from what the image expects
          # (a new env var or volume added in the repo used to need a manual copy).
          cp "$HOME/rc-build/$SHA/relay/docker-compose.yml" docker-compose.yml
          # Provision the at-rest encryption key once, in .env on the host
          # (NOT in the state volume), so join codes survive a redeploy and a
          # volume copy stays useless without it. The file holds secrets:
          # owner-only, always.
          touch .env
          chmod 600 .env
          if ! grep -q '^RELAY_STATE_KEY=' .env; then
            echo "RELAY_STATE_KEY=$(openssl rand -hex 32)" >> .env
            echo "generated RELAY_STATE_KEY in .env"
          fi
          # Fail the deploy if the new container never becomes healthy — and
          # actually roll back. The old script logged "rolling back" and then
          # exited: --force-recreate had already replaced the running
          # container, so a failed deploy left production serving the broken
          # build while the deploy log claimed it had been undone.
          #
          # The recreate itself sits INSIDE the `if`, which is what suspends
          # `set -e` for it. As a bare command it was the one failure the
          # rollback could not survive: a compose error (bad image, port
          # taken, OOM) aborted the script on that very line, so the rollback
          # below never ran at all — the case it exists for.
          #
          # RELAY_IMAGE is pinned explicitly rather than left to compose's
          # `${RELAY_IMAGE:-relay-local:amd64}` default: a pin left in the
          # host's .env by an earlier manual rollback (DEPLOY.md documents
          # exactly that) silently kept recreating the OLD image, and the
          # health probe then passed — a green deploy that shipped nothing.
          if RELAY_IMAGE=relay-local:amd64 docker compose up -d --force-recreate relay && wait_healthy; then
            # Health says "a relay is up", not "OUR relay is up". Assert the
            # running container is really the image this deploy built.
            RUNNING=$(docker inspect -f '{{.Config.Image}}' \
              "$(docker compose ps -q relay)" 2>/dev/null || echo unknown)
            if [ "$RUNNING" != "relay-local:amd64" ]; then
              echo "DEPLOY MISMATCH: container is running '$RUNNING', not relay-local:amd64" >&2
              exit 1
            fi
            echo "relay healthy (running $RUNNING)"
          else
            echo "relay did not become healthy" >&2
            docker compose logs --tail 50 relay >&2 || true

            if [ -z "$ROLLBACK_TAG" ]; then
              echo "NO ROLLBACK TARGET — production is running the broken build" >&2
              exit 1
            fi

            echo "rolling back to $ROLLBACK_TAG" >&2
            # Move the default tag back to the last good image as well as
            # recreating from the rollback tag explicitly: docker-compose.yml
            # reads `image: ${RELAY_IMAGE:-relay-local:amd64}`, so leaving
            # relay-local:amd64 pointed at the broken build would let any later
            # plain `docker compose up` on the host bring it straight back.
            docker tag "$ROLLBACK_TAG" relay-local:amd64 \
              || echo "warning: could not move relay-local:amd64 back to $ROLLBACK_TAG" >&2
            if RELAY_IMAGE="$ROLLBACK_TAG" docker compose up -d --force-recreate relay && wait_healthy; then
              echo "ROLLED BACK: production is serving $ROLLBACK_TAG; this build was NOT deployed" >&2
            else
              echo "ROLLBACK FAILED: relay is not healthy on $ROLLBACK_TAG either — production is DOWN" >&2
              docker compose logs --tail 50 relay >&2 || true
            fi
            # Red either way: what was pushed is not what is running. The
            # cleanup below is deliberately skipped so the rollback tags stay.
            exit 1
          fi

          # Keep the three newest build contexts and rollback tags; drop the rest.
          # Deliberately NOT `docker image prune`: the builder's intermediate
          # stages are dangling images, so pruning them throws away the layer
          # cache and makes the next deploy rebuild the web UI from source
          # (~6 minutes instead of ~30 seconds).
          ls -1dt "$HOME"/rc-build/*/ 2>/dev/null | tail -n +4 | xargs -r rm -rf
          docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep '^relay-local:rollback-' | sort -r | tail -n +4 \
            | xargs -r -n1 docker rmi -f || true
          REMOTE
