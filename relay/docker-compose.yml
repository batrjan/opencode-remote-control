# Relay service for opencode-remote-control.
#
# Server layout (nginx runs on the host, not in Docker):
#   - this file + .env live in /opt/opencode-remote-control on the server
#   - nginx (host) proxies https://opencode.b4tr.net -> 127.0.0.1:8080
#   - certbot (host) uses webroot /var/www/certbot for ACME challenges
#
# .env (never committed, see .env.example; the deploy workflow ships this
# file and generates RELAY_STATE_KEY on first run):
#   RELAY_STATE_KEY=<64 hex chars, `openssl rand -hex 32`>      (generated)
#   RELAY_API_KEY=<legacy; the public session API ignores it>   (optional)
#   PORT=8080                                                   (optional)
#   RELAY_IMAGE=relay-local:amd64                               (optional)
#   RELAY_TRUST_PROXY=loopback, uniquelocal                     (optional)
services:
  relay:
    # The deploy workflow builds this image on the host (see the deploy section of
    # DEPLOY.md); set RELAY_IMAGE to roll back to a relay-local:rollback-* tag.
    image: ${RELAY_IMAGE:-relay-local:amd64}
    restart: unless-stopped
    # Localhost-only: all external traffic enters through host nginx.
    ports:
      - "127.0.0.1:${PORT:-8080}:${PORT:-8080}"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "${PORT:-8080}"
      # Persist the session set so a redeploy does not end every live share:
      # the store is in-memory, and losing it invalidates viewer cookies and
      # bridge tokens while the bridges are still running.
      RELAY_STATE_FILE: "${RELAY_STATE_FILE:-/data/state.json}"
      # Encrypts the state file at rest. The key lives in .env on the HOST, not
      # in the state volume, so a volume copy/backup is useless without it. With
      # a key, join codes survive a restart too; without one the file is
      # plaintext and codes are not persisted (install.sh / the deploy generate
      # the key automatically).
      RELAY_STATE_KEY: "${RELAY_STATE_KEY:-}"
      # Which proxy hop to believe for X-Forwarded-For. The per-IP limits key on
      # the CLIENT address; inside Docker the peer is the bridge gateway
      # (172.x), not loopback, so a bare 'loopback' collapsed every client into
      # one address and made the brute-force/registration limits global. The
      # port is published on 127.0.0.1 only, so the private-range peer can only
      # be the host's own nginx.
      RELAY_TRUST_PROXY: "${RELAY_TRUST_PROXY:-loopback, uniquelocal}"
    volumes:
      - relay-state:/data
    # Mirrors the Dockerfile HEALTHCHECK (image already has one; kept
    # explicit so `docker compose ps` health is guaranteed even for images
    # built without it).
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  relay-state:
