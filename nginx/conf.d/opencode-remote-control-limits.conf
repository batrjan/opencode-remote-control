# Shared rate-limit zones for the opencode-remote-control relay.
#
# Install: copy into /etc/nginx/conf.d/ (nginx.conf includes conf.d/*.conf
# BEFORE sites-enabled/*, so the vhost can reference these zones), then
# `nginx -t && systemctl reload nginx`.
#
# These are a coarse shield in FRONT of the relay, not the security control:
# the real brute-force brake lives in the relay (5 activations per IP per
# minute, 50 per hour, a per-session lockout after 20 failures in 15 minutes,
# and a 1 s delay on every wrong code). nginx exists here so a flood never
# reaches Node in the first place — an activation attempt costs the relay a
# SHA-256 and a one-second timer, which is cheap per request and expensive at
# 10k requests/s.
#
# $binary_remote_addr is the real client: nginx IS the edge here, so this is
# the peer address, not a forwarded header, and cannot be spoofed.

# Activation attempts (POST /api/activate) — code guessing.
limit_req_zone $binary_remote_addr zone=oc_activate:10m rate=20r/m;

# Session registration + status (/api/sessions...) — a bridge registers once
# per share and polls status rarely; the relay caps this at 12/hour per IP.
limit_req_zone $binary_remote_addr zone=oc_register:10m rate=60r/m;

# Everything else (the viewer UI and its proxied API traffic). The opencode
# web UI fires a few dozen requests during bootstrap, so the burst has to
# absorb a page load without ever delaying it.
limit_req_zone $binary_remote_addr zone=oc_general:10m rate=50r/s;

# Concurrent connections per client. SSE streams are long-lived (a viewer tab
# holds /event and /global/event open), so this is deliberately generous — it
# only has to stop one client from parking thousands of sockets.
limit_conn_zone $binary_remote_addr zone=oc_conn:10m;
