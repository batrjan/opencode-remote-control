# nginx vhost for the opencode-remote-control relay (nginx runs on the host).
# Install: symlink/copy into /etc/nginx/sites-enabled/, then `nginx -t && systemctl reload nginx`.
# TLS: issue with `certbot --nginx -d opencode.b4tr.net` or webroot:
#   mkdir -p /var/www/certbot
#   certbot certonly --webroot -w /var/www/certbot -d opencode.b4tr.net
server {
  listen 80;
  server_name opencode.b4tr.net;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl;
  server_name opencode.b4tr.net;
  ssl_certificate /etc/letsencrypt/live/opencode.b4tr.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/opencode.b4tr.net/privkey.pem;

  # TLS hardening (TLS 1.2+ only, modern ciphers, HSTS).
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    # WebSocket upgrade (bridge connects at /bridge).
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    # The relay trusts loopback proxies only; nginx must set XFF
    # authoritatively for per-IP rate limiting to work.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off; # for SSE
    proxy_read_timeout 86400;
  }
}

# Map for Connection header: only send "upgrade" when client requests it.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}
