# nginx vhost for the opencode-remote-control relay (nginx runs on the host).
# Install: symlink/copy into /etc/nginx/sites-enabled/, copy
# conf.d/opencode-remote-control-limits.conf into /etc/nginx/conf.d/ (it
# defines the limit zones referenced below), then `nginx -t && systemctl reload nginx`.
# TLS: issue with `certbot --nginx -d opencode.b4tr.net` or webroot:
#   mkdir -p /var/www/certbot
#   certbot certonly --webroot -w /var/www/certbot -d opencode.b4tr.net
# Anything arriving on :80 with a Host we do not serve. Without this block the
# vhost below is the effective default for port 80, so nginx hands it every
# unknown Host — and the redirect then reflects that Host straight back in
# Location. 444 closes the connection without a response instead.
server {
  listen 80 default_server;
  server_name _;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 444; }
}
server {
  listen 80;
  server_name opencode.b4tr.net;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  # The canonical host, NOT $host: $host is the client's own Host header, so
  # `https://$host$request_uri` echoed an attacker-chosen hostname into a 301.
  # Harmless in a browser (it sets Host from the URL it was given) but there is
  # no reason for this redirect to point anywhere but here.
  location / { return 301 https://opencode.b4tr.net$request_uri; }
}
server {
  listen 443 ssl;
  server_name opencode.b4tr.net;
  ssl_certificate /etc/letsencrypt/live/opencode.b4tr.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/opencode.b4tr.net/privkey.pem;

  # TLS hardening (TLS 1.2+ only, modern ciphers, HSTS).
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  # Proxy settings for every location below. nginx inherits proxy_* directives
  # into locations that do not redefine them, so they live here once instead of
  # being copied into each block (a copy that drifts is how a location quietly
  # loses X-Forwarded-For and collapses every client into one rate-limit key).
  proxy_http_version 1.1;
  # WebSocket upgrade (the bridge connects at /bridge).
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  # The relay trusts loopback/private proxies only; nginx must set XFF
  # authoritatively for per-IP rate limiting to work. $proxy_add_x_forwarded_for
  # appends the real peer, so express takes the right-most untrusted hop and a
  # client-supplied prefix is ignored.
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_buffering off; # for SSE
  proxy_connect_timeout 10s;
  proxy_read_timeout 86400;  # SSE streams and long-polls live for hours
  proxy_send_timeout 86400;

  # Body size. The default 1 MB silently truncated a viewer's prompt the moment
  # it carried a pasted file — the relay accepts up to 25 MB on authenticated
  # proxy traffic, so nginx has to allow at least that much to reach it. The
  # public, unauthenticated endpoints below cut it back down to 64 KB.
  # Exactly the relay's limit, not more: request bodies are buffered here whole
  # (proxy_request_buffering is on by default), so anything above it is spooled
  # by this host only for the relay to answer 413 — RELAY_PROXY_BODY_LIMIT_BYTES
  # is the number to keep it in step with (relay/test/nginx-body-limit.test.ts).
  client_max_body_size 25m;
  client_body_timeout 60s;

  # Compression toward viewers. Only text/html was compressed before (nginx's
  # default), so the UI bundle and every JSON transcript crossed to a phone or
  # tablet at full size. gzip_proxied is required because every response here
  # is proxied. text/event-stream is deliberately absent: compressing the live
  # event stream would hold each event in the gzip buffer instead of sending it.
  # (Bridge -> relay traffic is compressed by the bridge itself.) BREACH does not
  # apply: no response body carries a credential — the viewer token is a cookie.
  # The relay compresses nothing itself, and a type missing here goes out raw.
  # Not only text: the UI's text font ships as raw TrueType (/assets/Inter.ttf,
  # ~855 KB, fetched by every viewer with an empty cache), which gzip halves;
  # font/otf is the same format. The .ico favicons shrink to almost nothing.
  # woff/woff2, png, mp4 and aac are already compressed (gzip saves under 7%)
  # and are left out on purpose. relay/test/nginx-gzip-types.test.ts checks
  # this list against the types the relay serves the UI build with.
  gzip on;
  gzip_proxied any;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/javascript text/css text/plain image/svg+xml application/manifest+json font/ttf font/otf image/x-icon;

  # Rate limiting answers 429 (the relay's own limiter does too), not nginx's
  # default 503 — a client that is being throttled should be told so.
  limit_req_status 429;
  limit_conn_status 429;

  # Every other error on this host is JSON (the relay answers
  # {"error":"payload too large"} for a body IT rejects), so a body nginx
  # rejects first must not hand an API client an HTML page instead.
  error_page 413 = @too_large;
  location @too_large {
    default_type application/json;
    return 413 '{"error":"payload too large"}';
  }

  # Unauthenticated code guessing. Anyone may POST here, and each attempt costs
  # the relay a hash plus a deliberate one-second delay, so the flood is stopped
  # at the edge; the real control is the relay's per-share lockout (five wrong
  # codes in a row lock that share for 15 minutes, from any address).
  # An exact, case-sensitive match is enough only because the relay activates
  # at exactly this path and answers 404 to any other spelling (/API/activate,
  # /api/activate/); a spelling it served beyond this one would reach
  # `location /` and oc_general instead. Keep the two in step.
  location = /api/activate {
    limit_req zone=oc_activate burst=40 nodelay;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8080;
  }

  # Session registration (POST), presence (GET) and deletion (DELETE). Public
  # by design; the relay caps registrations at 12/hour per IP.
  # A case-sensitive prefix match covers every registration only because the
  # relay serves the session API under /api/sessions and /api/sessions/...
  # alone and answers 404 to any other spelling (/API/sessions); a spelling it
  # served beyond these would reach `location /` and oc_general instead. Keep
  # the two in step.
  location /api/sessions {
    limit_req zone=oc_register burst=10 nodelay;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8080;
  }

  # The bridge's WebSocket. This location exists for exactly one thing — the
  # bridge's long-lived socket — so a request that is not a WebSocket handshake
  # is answered here instead of being proxied. It used to carry no limit at
  # all, and an exact match beats the `/` prefix below, so this was the one
  # path around the edge shield: plain HTTP to it reached Node from a single
  # address far past what oc_general allows that address anywhere else. The
  # `return` runs in the rewrite phase, i.e. before limit_req, so such a flood
  # now costs nginx a 404 and never becomes a request Node sees at all; the
  # body matches the relay's own 404 so a mistyped client reads the same thing.
  #
  # What the two limits below see is therefore the handshake, which is why they
  # can be this loose: 30/min with a burst of 30 passes an office reconnecting
  # in one go after a relay restart, and 32 concurrent sockets per address is
  # far above the single one a bridge holds. A bridge retries a 429 with
  # backoff (only 401/403 end a share), so a throttled redial comes back.
  location = /bridge {
    # On the location, not inside the `if`: nginx rejects `default_type` there
    # ("directive is not allowed here"). It only types nginx's own answer —
    # a proxied response carries the upstream's Content-Type.
    default_type application/json;
    if ($http_upgrade !~* ^websocket$) {
      return 404 '{"error":"not found"}';
    }
    limit_req zone=oc_bridge burst=30 nodelay;
    limit_conn oc_bridge_conn 32;
    proxy_pass http://127.0.0.1:8080;
  }

  # The viewer UI and all proxied opencode traffic. The burst has to absorb
  # SEVERAL full UI bootstraps at once (~30 requests each) without delaying
  # any of them — viewers behind one NAT share this bucket — so `nodelay` is
  # deliberate: the rate only bites on sustained abuse.
  location / {
    limit_req zone=oc_general burst=400 nodelay;
    limit_conn oc_conn 256;
    proxy_pass http://127.0.0.1:8080;
  }
}
