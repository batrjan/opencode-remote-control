# nginx vhost for the opencode-remote-control relay (nginx runs on the host).
# Install: symlink/copy into /etc/nginx/sites-enabled/, then `nginx -t && systemctl reload nginx`.
# TLS: issue with `certbot --nginx -d opencode.b4tr.net` or webroot:
#   mkdir -p /var/www/certbot
#   certbot certonly --webroot -w /var/www/certbot -d opencode.b4tr.net
server {
  listen 80;
  server_name opencode.b4tr.net;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl;
  server_name opencode.b4tr.net;
  ssl_certificate /etc/letsencrypt/live/opencode.b4tr.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/opencode.b4tr.net/privkey.pem;
  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    # WebSocket upgrade (bridge connects at /bridge).
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # The relay trusts loopback proxies only; nginx must set XFF
    # authoritatively for per-IP rate limiting to work.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off; # for SSE
    proxy_read_timeout 86400;
  }
}
